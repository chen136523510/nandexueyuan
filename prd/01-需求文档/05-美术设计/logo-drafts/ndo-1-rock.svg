<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- NDO-1 厚涂岩塔Δ：Δ形变成一块厚重岩体，油画厚涂的块面感 + 一扇暖窗（德塔加护微光） -->
  <defs>
    <linearGradient id="ndo1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3630"/>
      <stop offset="1" stop-color="#151E19"/>
    </linearGradient>
    <linearGradient id="ndo1-rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41543F"/>
      <stop offset="0.55" stop-color="#31402F"/>
      <stop offset="1" stop-color="#1F2B1F"/>
    </linearGradient>
    <radialGradient id="ndo1-win" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFE3B0"/>
      <stop offset="0.6" stop-color="#E9BE85"/>
      <stop offset="1" stop-color="#D4A574"/>
    </radialGradient>
    <filter id="ndo1-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- 油画厚涂质感：分形噪声置换边缘，模拟笔触堆叠的不平整 -->
    <filter id="ndo1-paint" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="28" fill="url(#ndo1-bg)"/>

  <g filter="url(#ndo1-paint)">
    <!-- Δ 主体：厚重的等腰三角形岩体 -->
    <path d="M120 42 L196 192 Q120 208 44 192 Z" fill="url(#ndo1-rock)"/>
    <!-- 左侧受月光/天光的亮面（厚涂块面） -->
    <path d="M120 42 L44 192 Q82 200 108 196 Z" fill="#4A5F46" opacity="0.55"/>
    <!-- 中脊过渡面 -->
    <path d="M120 42 L126 194 L108 196 Q112 120 120 42 Z" fill="#242F24" opacity="0.5"/>
    <!-- 底部反光 -->
    <path d="M60 186 Q120 202 180 186 L176 192 Q120 208 64 192 Z" fill="#566B50" opacity="0.35"/>
    <!-- 左缘赭金轮廓光（戏剧性打光） -->
    <path d="M120 42 L44 192" stroke="#D4A574" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- 暖窗：塔身一扇亮着的窗（总有一盏灯） -->
  <circle cx="118" cy="150" r="26" fill="#E9BE85" opacity="0.35" filter="url(#ndo1-glow)"/>
  <rect x="109" y="139" width="18" height="22" rx="3" fill="url(#ndo1-win)"/>
  <rect x="109" y="139" width="18" height="22" rx="3" fill="none" stroke="#8A6A3F" stroke-width="1.2" opacity="0.6"/>
  <line x1="118" y1="139" x2="118" y2="161" stroke="#8A6A3F" stroke-width="1.2" opacity="0.6"/>

  <!-- 画布噪点：整幅覆盖极淡的颗粒，去掉数码平涂感 -->
  <filter id="ndo1-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/>
  </filter>
  <rect width="240" height="240" rx="28" fill="#FFFFFF" filter="url(#ndo1-grain)"/>
</svg>
