<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- WEB-7 年轮：2022至今53万条消息，「一圈一圈聊出来的年轮」。偏心不完美同心弧，与岁月史书模块呼应 -->
  <rect width="240" height="240" rx="24" fill="#F5F2EC"/>

  <!-- 四圈偏心弧：每圈缺口方向不同、粗细递增，圆心微漂移模拟真实年轮 -->
  <!-- 内圈 r18 圆心(122,116) 缺口朝右 -->
  <path d="M139 110 A18 18 0 1 1 139 122" fill="none" stroke="#35483A" stroke-width="3"/>
  <!-- 二圈 r38 圆心(118,122) 缺口朝右上 -->
  <path d="M152 88 A38 38 0 1 1 154 154" fill="none" stroke="#7E937A" stroke-width="3.4"/>
  <!-- 三圈 r58 圆心(124,118) 缺口朝左上 -->
  <path d="M66 66 A58 58 0 1 1 66 170" fill="none" stroke="#A8C5A0" stroke-width="4"/>
  <!-- 外圈 r78 圆心(120,120) 缺口大（呼吸口）朝右 -->
  <path d="M193 146 A78 78 0 1 1 193 94" fill="none" stroke="#4A4A4A" stroke-width="5.5" stroke-linecap="round"/>

  <!-- 年髓：中心暖赭实心点（血缘色，心跳） -->
  <circle cx="122" cy="116" r="5.5" fill="#D4A574"/>

  <!-- 新芽：最外圈缺口处一颗暖赭小点（正在长的新一圈--年轮还在长，社区还在聊） -->
  <circle cx="196" cy="120" r="3.5" fill="#EBCE97"/>
  <circle cx="196" cy="120" r="1.8" fill="#D4A574"/>
</svg>
