<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>诺诺渲染管线 PoC · R-058</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.55); color: #eee; padding: 10px 14px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
    }
    #hud button {
      margin-right: 6px; padding: 4px 12px; cursor: pointer;
      border: 1px solid #555; border-radius: 6px;
      background: #2a2a4e; color: #eee; font-size: 13px;
    }
    #hud button:hover { background: #3d3d6e; }
    #hud button.on { background: #4a6cf7; border-color: #4a6cf7; }
    #status { color: #9f9; }
    #recipeJson {
      width: 340px; margin-top: 4px; display: block;
      background: #101024; color: #9f9; border: 1px solid #444; border-radius: 6px;
      font: 12px/1.5 monospace; padding: 6px; resize: vertical;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div>诺诺渲染管线 PoC · R-058 <span id="status">加载中…</span></div>
    <div style="margin-top:6px">
      <button data-expr="">默认脸</button>
      <button data-expr="happy">开心</button>
      <button data-expr="relaxed">放松</button>
      <button data-expr="sad">低落</button>
      <button data-expr="angry">生气</button>
    </div>
    <div style="margin-top:6px">模型：
      <button data-model="v7">v7·贴片眼优化</button>
      <button data-model="v6">v6·3D眼球</button>
      <button data-model="v5">v5·贴片眼对照</button>
      <a href="?blink=1" style="color:#8cf;margin-left:4px;font-size:12px">闭眼定格</a>
    </div>
    <div style="margin-top:6px">动作：<span id="animHud"></span></div>
    <div style="margin-top:6px">配方：<span id="recipeHud">
      <button data-recipe="hands_behind_back">背手</button>
      <button data-recipe="shoulder_shrug">耸肩</button>
      <button data-recipe="head_tilt">歪头</button>
      <button data-recipe="sit_chair">坐下</button>
      <button data-recipe="stand_up">起立</button>
      <button data-recipe="doze">打瞌睡</button>
      <button data-recipe="stretch">伸懒腰</button>
      <button data-recipe="__stop">停配方</button>
    </span></div>
    <div style="margin-top:6px">小脑测试台（粘贴配方 JSON，免刷新即播）：
      <button id="recipePlayJson">▶ 播放 JSON</button>
      <textarea id="recipeJson" rows="5" spellcheck="false" placeholder='{"id":"demo","label":"测试","sequence":[{"op":"rotate","bone":"head","axis":"z","deg":12,"dur":0.5}]}'></textarea>
    </div>
    <div id="roomHud" style="margin-top:6px;display:none">
      时间：<span id="timeHud"></span>
      <button id="roomLampBtn">灯</button>
      <button id="roomCurBtn">帘</button><br>
      天气：<span id="weatherHud"></span><br>
      季节：<span id="seasonHud"></span><br>
      交互：<span id="anchorHud"></span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
