<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>诺诺渲染管线 PoC · R-058</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.55); color: #eee; padding: 10px 14px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
    }
    #hud button {
      margin-right: 6px; padding: 4px 12px; cursor: pointer;
      border: 1px solid #555; border-radius: 6px;
      background: #2a2a4e; color: #eee; font-size: 13px;
    }
    #hud button:hover { background: #3d3d6e; }
    #hud button.on { background: #4a6cf7; border-color: #4a6cf7; }
    #status { color: #9f9; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div>诺诺渲染管线 PoC · R-058 <span id="status">加载中…</span></div>
    <div style="margin-top:6px">
      <button data-expr="">默认脸</button>
      <button data-expr="happy">开心</button>
      <button data-expr="relaxed">放松</button>
      <button data-expr="sad">低落</button>
      <button data-expr="angry">生气</button>
    </div>
    <div style="margin-top:6px">模型：
      <button data-model="v6">v6·3D眼球</button>
      <button data-model="v5">v5·贴片眼对照</button>
      <a href="?blink=1" style="color:#8cf;margin-left:4px;font-size:12px">闭眼定格</a>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
